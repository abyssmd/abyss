name: Bug report
description: Something in Abyss isn't working as it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace
        2. ...
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Mac
        - iPhone
        - iPad
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Abyss version and OS version
      placeholder: Abyss 2.6.0, macOS 15.5
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
